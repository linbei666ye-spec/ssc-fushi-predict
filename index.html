<script>
const API_CURRENT =
"https://speedy10-proxy.lin-bei666ye.workers.dev/api?type=current";

const API_HISTORY =
"https://speedy10-proxy.lin-bei666ye.workers.dev/api?type=history";

const KEY = "ssc_fushi_predict_dynamic_v2";

const REFRESH_SECONDS = 45;

const SYSTEMS = [
{
 name:"前三",
 positions:[0,1,2],
 labels:["万位","千位","百位"]
},
{
 name:"中三",
 positions:[1,2,3],
 labels:["千位","百位","十位"]
},
{
 name:"后三",
 positions:[2,3,4],
 labels:["百位","十位","个位"]
}
];

let draws = [];
let records = [[],[],[]];

let activeTab = 0;
let activeHistory = 0;

let currentIssue = "";
let secondsLeft = REFRESH_SECONDS;
let loading = false;
let refreshTimer = null;
let countdownTimer = null;
let lastRefreshTime = "";

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify({
   draws:draws,
   records:records,
   currentIssue:currentIssue
  }));
 }catch(e){
  console.error("保存失败",e);
 }
}

function restore(){
 try{
  const x = JSON.parse(localStorage.getItem(KEY)||"{}");

  draws = Array.isArray(x.draws)?x.draws:[];
  records = Array.isArray(x.records)&&x.records.length===3
   ?x.records:[[],[],[]];

  currentIssue = x.currentIssue || draws[0]?.issue || "";

 }catch(e){
  draws=[];
  records=[[],[],[]];
 }
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function issueNext(issue){
 if(!issue)return "下一期";

 const m=String(issue).match(/(\d+)$/);
 if(!m)return "下一期";

 const n=m[1];

 try{
  return String(BigInt(n)+1n).padStart(n.length,"0");
 }catch(e){
  return "下一期";
 }
}

function normalizeCode(code){
 if(Array.isArray(code)){
  const nums=code.map(Number);
  return nums.length===5&&nums.every(n=>Number.isInteger(n)&&n>=0&&n<=9)
   ?nums:null;
 }

 if(typeof code==="number"){
  code=String(code).padStart(5,"0");
 }

 if(typeof code!=="string")return null;

 const separated=code.match(/^\s*([0-9])[\s,，\-|]+([0-9])[\s,，\-|]+([0-9])[\s,，\-|]+([0-9])[\s,，\-|]+([0-9])\s*$/);

 if(separated){
  return separated.slice(1).map(Number);
 }

 const compact=code.replace(/\D/g,"");

 if(compact.length===5){
  return compact.split("").map(Number);
 }

 return null;
}

function addDraw(list,issue,code){
 const nums=normalizeCode(code);

 if(!nums)return;

 const id=String(issue||"").trim();

 if(!id)return;

 if(list.some(d=>d.issue===id))return;

 list.push({
  issue:id,
  nums:nums
 });
}

/* 解析历史接口各种常见数据结构 */
function parseHistoryJSON(json){
 const result=[];
 const seen=new Set();

 function walk(obj,depth){
  if(!obj||depth>12)return;

  if(Array.isArray(obj)){
   obj.forEach(x=>walk(x,depth+1));
   return;
  }

  if(typeof obj!=="object")return;

  const issue =
   obj.preDrawIssue ??
   obj.issue ??
   obj.drawIssue ??
   obj.expect ??
   obj.period ??
   obj.qihao ??
   obj.issueNo;

  const code =
   obj.preDrawCode ??
   obj.drawCode ??
   obj.code ??
   obj.numbers ??
   obj.openCode ??
   obj.resultCode ??
   obj.lotteryCode;

  if(issue!==undefined&&code!==undefined){
   const id=String(issue);

   if(!seen.has(id)){
    const nums=normalizeCode(code);

    if(nums){
     seen.add(id);
     result.push({issue:id,nums:nums});
    }
   }
  }

  Object.keys(obj).forEach(k=>{
   const value=obj[k];

   if(value&&typeof value==="object"){
    walk(value,depth+1);
   }
  });
 }

 walk(json,0);

 result.sort((a,b)=>{
  if(/^\d+$/.test(a.issue)&&/^\d+$/.test(b.issue)){
   return BigInt(a.issue)>BigInt(b.issue)?-1:
          BigInt(a.issue)<BigInt(b.issue)?1:0;
  }
  return 0;
 });

 return result.slice(0,100);
}

function parseCurrentJSON(json){
 const d=json?.result?.data;

 if(!d)throw new Error("当前开奖接口没有返回 data");

 if(Number(json.errorCode)!==0){
  throw new Error(json.message||"开奖接口返回错误");
 }

 const nums=normalizeCode(d.preDrawCode);

 if(!nums)throw new Error("无法识别当前开奖号码");

 return {
  issue:String(d.preDrawIssue),
  nums:nums,
  nextIssue:String(d.drawIssue||issueNext(d.preDrawIssue)),
  drawTime:d.preDrawTime||""
 };
}

function mergeDraws(history,current){
 const map=new Map();

 draws.forEach(d=>{
  if(d&&d.issue&&Array.isArray(d.nums)){
   map.set(String(d.issue),{
    issue:String(d.issue),
    nums:d.nums.map(Number)
   });
  }
 });

 history.forEach(d=>{
  map.set(String(d.issue),d);
 });

 if(current){
  map.set(String(current.issue),{
   issue:String(current.issue),
   nums:current.nums
  });
 }

 const result=Array.from(map.values());

 result.sort((a,b)=>{
  if(/^\d+$/.test(a.issue)&&/^\d+$/.test(b.issue)){
   return BigInt(a.issue)>BigInt(b.issue)?-1:
          BigInt(a.issue)<BigInt(b.issue)?1:0;
  }
  return 0;
 });

 return result.slice(0,100);
}

/* 多算法动态评分 */
function chooseNumbers(position){
 if(!draws.length){
  return {
   numbers:[],
   scores:[]
  };
 }

 const data=draws.slice(0,100);

 const total=Array(10).fill(0);
 const recent10=Array(10).fill(0);
 const recent20=Array(10).fill(0);
 const recent30=Array(10).fill(0);
 const lastIndex=Array(10).fill(-1);
 const recentFirst=Array(10).fill(0);
 const recentSecond=Array(10).fill(0);

 data.forEach((d,index)=>{
  const n=d.nums[position];

  if(!Number.isInteger(n)||n<0||n>9)return;

  total[n]++;

  if(index<10)recent10[n]++;
  if(index<20)recent20[n]++;
  if(index<30)recent30[n]++;

  if(lastIndex[n]===-1){
   lastIndex[n]=index;
  }
 });

 const half=Math.max(1,Math.floor(data.length/2));

 data.forEach((d,index)=>{
  const n=d.nums[position];

  if(index<half)recentFirst[n]++;
  else recentSecond[n]++;
 });

 const maxTotal=Math.max(1,data.length);
 const max10=Math.min(10,data.length);
 const max20=Math.min(20,data.length);
 const max30=Math.min(30,data.length);

 const scores=Array.from({length:10},(_,n)=>{
  const frequency=total[n]/maxTotal;
  const hot10=recent10[n]/max10;
  const hot20=recent20[n]/max20;
  const hot30=recent30[n]/max30;

  const omission=lastIndex[n]===-1
   ?data.length
   :lastIndex[n];

  const omissionScore=Math.min(omission,30)/30;

  const trend=(recentFirst[n]-recentSecond[n])/
   Math.max(1,half);

  const trendScore=Math.max(0,Math.min(1,0.5+trend));

  const weightedRecent=
   hot10*0.50+
   hot20*0.30+
   hot30*0.20;

  const weights={
   frequency:0.25,
   recent:0.35,
   omission:0.15,
   trend:0.15,
   balance:0.10
  };

  const score=
   frequency*weights.frequency+
   weightedRecent*weights.recent+
   omissionScore*weights.omission+
   trendScore*weights.trend+
   (0.5+Math.min(0.5,Math.abs(trend)))*weights.balance;

  return {
   n:n,
   score:score,
   frequency:frequency,
   recent:weightedRecent,
   omission:omission,
   trend:trend
  };
 });

 const selected=scores
  .slice()
  .sort((a,b)=>b.score-a.score||a.n-b.n)
  .slice(0,7);

 selected.sort((a,b)=>a.n-b.n);

 return {
  numbers:selected.map(x=>x.n),
  scores:selected
 };
}

function makePrediction(systemIndex){
 const sys=SYSTEMS[systemIndex];

 const positions=sys.positions.map(p=>{
  return chooseNumbers(p).numbers;
 });

 return {
  targetIssue:issueNext(currentIssue),
  sourceIssue:currentIssue,
  createdAt:Date.now(),
  positions:positions,
  result:"待开奖",
  actual:null
 };
}

function createPredictions(){
 if(draws.length<10||!currentIssue)return;

 const target=issueNext(currentIssue);

 for(let i=0;i<3;i++){
  const exists=records[i].some(r=>
   r.targetIssue===target
  );

  if(!exists){
   records[i].unshift(makePrediction(i));
   records[i]=records[i].slice(0,300);
  }
 }
}

function settleRecords(){
 if(!draws.length)return;

 for(let s=0;s<3;s++){
  records[s].forEach(r=>{
   if(r.result!=="待开奖")return;

   const actual=draws.find(d=>
    String(d.issue)===String(r.targetIssue)
   );

   if(!actual)return;

   const sys=SYSTEMS[s];

   const hit=sys.positions.every((p,j)=>
    r.positions[j].includes(actual.nums[p])
   );

   r.actual=actual.nums.slice();
   r.result=hit?"中":"挂";
   r.settledAt=Date.now();
  });
 }
}

/* 获取当前和历史开奖 */
async function fetchJSON(url){
 const response=await fetch(url,{
  cache:"no-store"
 });

 if(!response.ok){
  throw new Error("HTTP "+response.status);
 }

 return await response.json();
}

async function loadData(){
 if(loading)return;

 loading=true;

 const status=document.getElementById("dataStatus");

 status.className="status";
 status.textContent="正在读取最新开奖和历史数据...";

 let current=null;
 let history=[];
 let errors=[];

 try{
  const results=await Promise.allSettled([
   fetchJSON(API_CURRENT),
   fetchJSON(API_HISTORY)
  ]);

  if(results[0].status==="fulfilled"){
   try{
    current=parseCurrentJSON(results[0].value);
   }catch(e){
    errors.push("当前开奖："+e.message);
   }
  }else{
   errors.push("当前开奖连接失败");
  }

  if(results[1].status==="fulfilled"){
   history=parseHistoryJSON(results[1].value);
  }else{
   errors.push("历史开奖连接失败");
  }

  if(!current&&!history.length){
   throw new Error(errors.join("；")||"没有获取到开奖数据");
  }

  const oldIssue=currentIssue;

  draws=mergeDraws(history,current);

  if(current){
   currentIssue=current.issue;
  }else if(draws.length){
   currentIssue=draws[0].issue;
  }

  settleRecords();
  createPredictions();

  save();
  render();

  lastRefreshTime=new Date().toLocaleTimeString();

  if(errors.length){
   status.className="status yellow";
   status.textContent=
    "部分数据读取成功："+draws.length+
    "期。"+errors.join("；");
  }else{
   status.className="status ok";
   status.textContent=
    "数据读取成功："+draws.length+
    "期历史数据。最近刷新："+lastRefreshTime;
  }

  if(oldIssue&&currentIssue!==oldIssue){
   console.log("检测到新期开奖",currentIssue);
  }

 }catch(e){
  status.className="status err";
  status.textContent="读取失败："+e.message+
   "。45秒后自动重试。";

 }finally{
  loading=false;
  resetCountdown();
 }
}

/* 所有刷新方式统一使用45秒倒计时 */
function resetCountdown(){
 secondsLeft=REFRESH_SECONDS;
 updateCountdown();

 if(refreshTimer){
  clearTimeout(refreshTimer);
 }

 refreshTimer=setTimeout(()=>{
  loadData();
 },REFRESH_SECONDS*1000);
}

function updateCountdown(){
 const el=document.getElementById("countdown");
 const bar=document.getElementById("countBar");

 const s=Math.max(0,secondsLeft);

 const mm=String(Math.floor(s/60)).padStart(2,"0");
 const ss=String(s%60).padStart(2,"0");

 el.textContent=mm+":"+ss;

 bar.style.width=
  (s/REFRESH_SECONDS*100)+"%";
}

function startCountdown(){
 if(countdownTimer){
  clearInterval(countdownTimer);
 }

 countdownTimer=setInterval(()=>{
  if(secondsLeft>0){
   secondsLeft--;
   updateCountdown();
  }

  if(secondsLeft<=0&&!loading){
   loadData();
  }
 },1000);
}

function manualRefresh(){
 if(refreshTimer){
  clearTimeout(refreshTimer);
 }

 secondsLeft=REFRESH_SECONDS;
 updateCountdown();

 loadData();
}

/* 切换预测系统 */
function switchTab(i){
 activeTab=i;

 document.querySelectorAll("#systemTabs .tab")
  .forEach((b,j)=>{
   b.classList.toggle("active",j===i);
  });

 for(let j=0;j<3;j++){
  document.getElementById("system"+j)
   .classList.toggle("active",j===i);
 }
}

/* 切换历史记录 */
function historyTab(i){
 activeHistory=i;

 document.querySelectorAll("#historyTabs .tab")
  .forEach((b,j)=>{
   b.classList.toggle("active",j===i);
  });

 renderHistory();
}

function renderSystem(i){
 const sys=SYSTEMS[i];
 const r=records[i][0];
 const el=document.getElementById("system"+i);

 if(!r){
  el.innerHTML='<div class="status">等待足够的开奖数据，至少需要10期。</div>';
  return;
 }

 let html=
  '<div class="status">预测期号：'+
  esc(r.targetIssue)+'</div>';

 html+=
  '<div class="status">分析依据：最近 '+
  draws.length+' 期历史数据</div>';

 html+=
  '<div class="status">预测生成：'+
  new Date(r.createdAt).toLocaleString()+
  '</div>';

 r.positions.forEach((nums,j)=>{
  const position=sys.positions[j];
  const analysis=chooseNumbers(position);

  html+='<div class="position">';
  html+='<div class="position-title">'+
   sys.labels[j]+' · 推荐7个号码</div>';

  html+='<div class="numbers">';

  for(let n=0;n<10;n++){
   html+='<div class="num '+
    (nums.includes(n)?"selected":"")+
    '">'+n+'</div>';
  }

  html+='</div>';

  html+='<div class="score">推荐号码：'+
   nums.join("、")+'</div>';

  if(analysis.scores.length){
   html+='<div class="score">动态综合算法评分：'+
    analysis.scores.map(x=>
     x.n+':'+(x.score*100).toFixed(1)
    ).join("  ")+'</div>';
  }

  html+='</div>';
 });

 const cls=
  r.result==="中"?"win":
  r.result==="挂"?"lose":"wait";

 html+='<div class="result '+cls+'">本期结果：'+
  r.result+'</div>';

 if(r.actual){
  html+='<div class="status" style="margin-top:9px">实际开奖号码：'+
   sys.positions.map(p=>r.actual[p]).join(" - ")+
   '</div>';
 }

 html+='<div class="actions">';
 html+='<button class="action secondary" onclick="newPrediction('+i+')">重新生成预测</button>';
 html+='</div>';

 el.innerHTML=html;
}

function newPrediction(i){
 if(!draws.length){
  alert("请先读取开奖数据");
  return;
 }

 const target=issueNext(currentIssue);

 const existing=records[i].find(r=>
  r.result==="待开奖"&&
  r.targetIssue===target
 );

 if(existing){
  if(!confirm("当前期号已有预测，确定替换吗？"))return;

  records[i]=records[i].filter(r=>r!==existing);
 }

 records[i].unshift(makePrediction(i));

 records[i]=records[i].slice(0,300);

 save();
 render();
}

function renderStats(){
 for(let i=0;i<3;i++){
  const settled=records[i].filter(r=>
   r.result==="中"||r.result==="挂"
  );

  const wins=settled.filter(r=>
   r.result==="中"
  ).length;

  const loses=settled.length-wins;

  const rate=settled.length
   ?wins/settled.length*100
   :0;

  document.getElementById("rate"+i)
   .textContent=rate.toFixed(1)+"%";

  document.getElementById("count"+i)
   .textContent=wins+"中 / "+loses+"挂";
 }
}

function renderHistory(){
 const list=records[activeHistory]||[];
 const el=document.getElementById("historyList");

 if(!list.length){
  el.innerHTML='<div class="status">暂无预测记录</div>';
  return;
 }

 el.innerHTML=list.slice(0,100).map(r=>{
  const cls=
   r.result==="中"?"win":
   r.result==="挂"?"lose":"wait";

  return '<div class="history-item">'+
   '<strong>预测期号：'+esc(r.targetIssue)+'</strong><br>'+
   SYSTEMS[activeHistory].labels.map((label,j)=>
    label+"："+r.positions[j].join("、")
   ).join("<br>")+
   '<br>结果：<span class="history-result '+cls+'">'+
   r.result+'</span>'+
   (r.actual?
    '<br>实际开奖号码：'+r.actual.join(" - "):
    '')+
   '<br><small>预测时间：'+
   new Date(r.createdAt).toLocaleString()+
   '</small></div>';
 }).join("");
}

function render(){
 const latest=draws[0];

 document.getElementById("drawIssue").textContent=
  latest?
  "最新已开奖期号："+latest.issue:
  "暂无开奖数据";

 document.getElementById("drawBalls").innerHTML=
  latest?
  latest.nums.map(n=>
   '<div class="ball red">'+n+'</div>'
  ).join(""):
  '<div class="ball">-</div>'.repeat(5);

 for(let i=0;i<3;i++){
  renderSystem(i);
 }

 renderStats();
 renderHistory();
}

function showImport(){
 document.getElementById("importPanel").style.display="block";
}

function hideImport(){
 document.getElementById("importPanel").style.display="none";
}

function importData(){
 const text=document.getElementById("manualData").value.trim();

 if(!text){
  alert("请先粘贴开奖数据");
  return;
 }

 const list=[];
 const lines=text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);

 lines.forEach(line=>{
  const m=line.match(/(\d{5,12})\D{0,15}([0-9][\s,，\-|]+[0-9][\s,，\-|]+[0-9][\s,，\-|]+[0-9][\s,，\-|]+[0-9]|[0-9]{5})/);

  if(m){
   addDraw(list,m[1],m[2]);
  }
 });

 if(!list.length){
  alert("无法识别数据，请按：期号 12345 的格式填写");
  return;
 }

 draws=mergeDraws(list,null);

 if(draws.length){
  currentIssue=draws[0].issue;
 }

 settleRecords();
 createPredictions();

 save();
 render();

 hideImport();

 document.getElementById("dataStatus").className="status ok";
 document.getElementById("dataStatus").textContent=
  "手动导入成功："+list.length+"期";

 manualRefresh();

 alert("导入成功！");
}

function exportData(){
 const data=JSON.stringify({
  draws:draws,
  records:records,
  currentIssue:currentIssue
 },null,2);

 const blob=new Blob([data],{
  type:"application/json"
 });

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="极速时时彩复式预测备份.json";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function clearHistory(){
 if(!confirm("确定清空三个系统的全部预测记录吗？此操作不能撤销。"))return;

 records=[[],[],[]];

 createPredictions();

 save();
 render();
}

/* 启动 */
restore();
render();
startCountdown();
loadData();

</script>
</body>
</html>
