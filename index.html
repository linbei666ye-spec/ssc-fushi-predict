
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>极速时时彩复式预测</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8edf8;font-family:Arial,"Microsoft YaHei",sans-serif;padding:14px}
h1{font-size:22px;text-align:center;margin:8px 0 18px}
h2{font-size:17px;margin:0 0 12px}
.card{background:#151e32;border:1px solid #263550;border-radius:13px;padding:14px;margin-bottom:13px}
.muted{color:#91a1bd;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.drawnums{display:flex;justify-content:center;gap:9px;margin:15px 0}
.ball{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ff6262,#c91d35);font-size:21px;font-weight:bold;color:white;box-shadow:0 3px 9px #0006}
.countdown{text-align:center;font-size:32px;font-weight:bold;color:#ffd166;margin:12px 0}
.issue{text-align:center;color:#a9bad7;font-size:13px}
.numbers{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.num{width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#263550;color:#dce8ff;font-weight:bold}
.num.selected{background:#e6a52c;color:#151515}
.num.hit{background:#16a36a;color:white}
.status{font-weight:bold}
.win{color:#30d99a}.lose{color:#ff6868}.pending{color:#ffd166}
button{border:0;border-radius:8px;padding:10px 13px;background:#2878e8;color:white;font-size:14px;margin:4px 3px 4px 0}
button.secondary{background:#35445e}
button.danger{background:#b63848}
textarea{width:100%;min-height:100px;background:#0c1425;color:#e8edf8;border:1px solid #35445e;border-radius:8px;padding:10px}
input{background:#0c1425;color:white;border:1px solid #35445e;padding:8px;border-radius:7px}
.stat{display:flex;justify-content:space-around;text-align:center;margin-top:12px}
.stat strong{display:block;font-size:20px;margin-top:4px}
.record{border-top:1px solid #2a3850;padding:10px 0;font-size:13px}
.small{font-size:12px;color:#a9bad7}
#message{font-size:12px;color:#9db1d2;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>

<h1>极速时时彩复式预测</h1>

<div class="card">
  <div class="row">
    <strong>最新开奖结果</strong>
    <span class="muted" id="dataStatus">正在连接数据...</span>
  </div>
  <div class="drawnums" id="latestNumbers">
    <span class="muted">等待开奖数据</span>
  </div>
  <div class="issue" id="latestIssue">期号：--</div>
  <div class="muted" style="text-align:center;margin-top:7px" id="drawTimeText">下一期开奖时间：--</div>
  <div class="countdown" id="countdown">--:--:--</div>
  <div class="muted" style="text-align:center">距离下一期开奖</div>
  <div style="text-align:center;margin-top:10px">
    <button onclick="manualRefresh()">立即刷新</button>
  </div>
</div>

<div class="card">
  <h2>前三预测（万位、千位、百位）</h2>
  <div class="muted">目标期号：<span id="issueFirst">--</span></div>
  <div id="firstPrediction"></div>
  <div class="stat">
    <div><span class="muted">命中</span><strong class="win" id="firstWin">0</strong></div>
    <div><span class="muted">未中</span><strong class="lose" id="firstLose">0</strong></div>
    <div><span class="muted">命中率</span><strong id="firstRate">0%</strong></div>
  </div>
</div>

<div class="card">
  <h2>中三预测（千位、百位、十位）</h2>
  <div class="muted">目标期号：<span id="issueMiddle">--</span></div>
  <div id="middlePrediction"></div>
  <div class="stat">
    <div><span class="muted">命中</span><strong class="win" id="middleWin">0</strong></div>
    <div><span class="muted">未中</span><strong class="lose" id="middleLose">0</strong></div>
    <div><span class="muted">命中率</span><strong id="middleRate">0%</strong></div>
  </div>
</div>

<div class="card">
  <h2>后三预测（百位、十位、个位）</h2>
  <div class="muted">目标期号：<span id="issueLast">--</span></div>
  <div id="lastPrediction"></div>
  <div class="stat">
    <div><span class="muted">命中</span><strong class="win" id="lastWin">0</strong></div>
    <div><span class="muted">未中</span><strong class="lose" id="lastLose">0</strong></div>
    <div><span class="muted">命中率</span><strong id="lastRate">0%</strong></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <h2>预测记录</h2>
    <span class="muted" id="recordCount">0条记录</span>
  </div>
  <div id="records"></div>
</div>

<div class="card">
  <h2>历史开奖数据</h2>
  <div class="muted" id="historyInfo">正在读取历史数据...</div>
  <div id="historyList"></div>
</div>

<div class="card">
  <h2>数据导入与备份</h2>
  <div class="muted">可以粘贴历史开奖 JSON 或开奖文本进行导入。</div>
  <textarea id="importText" placeholder="把历史开奖数据粘贴在这里"></textarea>
  <button onclick="importData()">导入数据</button>
  <button class="secondary" onclick="exportData()">导出备份</button>
  <button class="danger" onclick="clearRecords()">清空预测记录</button>
  <div id="message"></div>
</div>

<script>
const API_CURRENT="https://speedy10-proxy.lin-bei666ye.workers.dev/api?type=current";
const API_HISTORY="https://speedy10-proxy.lin-bei666ye.workers.dev/api?type=history";
const STORAGE_KEY="ssc_fushi_predict_dynamic_v2";
const REFRESH_SECONDS=45;

const SYSTEMS=[
  {id:"first",name:"前三",positions:[0,1,2]},
  {id:"middle",name:"中三",positions:[1,2,3]},
  {id:"last",name:"后三",positions:[2,3,4]}
];

let draws=[];
let records=[];
let currentIssue="";
let nextIssue="";
let latestCode=[];
let nextDrawAt=0;
let nextCheckAt=Date.now()+REFRESH_SECONDS*1000;
let nextZeroCheckAt=0;
let loading=false;
let lastError="";

function loadLocal(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    draws=Array.isArray(saved.draws)?saved.draws:[];
    records=Array.isArray(saved.records)?saved.records:[];
  }catch(e){
    draws=[];
    records=[];
  }
  if(!draws.length){
    try{
      const old=JSON.parse(localStorage.getItem("ssc_fushi_predict_v1")||"{}");
      if(Array.isArray(old.draws))draws=old.draws;
      if(Array.isArray(old.records))records=old.records;
    }catch(e){}
  }
}

function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({draws,records}));
  }catch(e){
    setMessage("本地保存失败，可能是手机存储空间不足。");
  }
}

function normalizeCode(value){
  if(Array.isArray(value))value=value.join(",");
  if(typeof value==="number")value=String(value);
  if(typeof value!=="string")return null;

  const parts=value.match(/\d+/g);
  if(!parts)return null;

  let digits;
  if(parts.length===5 && parts.every(x=>x.length<=2)){
    digits=parts.map(x=>String(Number(x))).join("");
  }else{
    digits=value.replace(/\D/g,"");
  }

  if(digits.length!==5)return null;
  return digits.split("").map(Number);
}

function parseCurrent(json){
  const d=json?.result?.data;
  if(!d)throw new Error("当前开奖接口没有返回 result.data");

  const code=normalizeCode(d.preDrawCode);
  if(!code)throw new Error("当前开奖结果格式无法识别");

  return {
    issue:String(d.preDrawIssue||""),
    code,
    nextIssue:String(d.drawIssue||""),
    drawTime:String(d.drawTime||""),
    serverTime:String(d.serverTime||"")
  };
}

function issueValue(issue){
  const n=Number(String(issue).replace(/\D/g,""));
  return Number.isFinite(n)?n:0;
}

function getNextIssue(issue){
  const n=issueValue(issue);
  return n?String(n+1):"";
}

function parseTimeParts(str){
  const m=String(str||"").match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/
  );
  if(!m)return null;
  return Date.UTC(
    Number(m[1]),Number(m[2])-1,Number(m[3]),
    Number(m[4]),Number(m[5]),Number(m[6]||0)
  );
}

function updateDrawCountdown(serverTime,drawTime){
  const server=parseTimeParts(serverTime);
  const target=parseTimeParts(drawTime);
  if(server===null||target===null)return;

  const difference=target-server;
  if(difference<0)return;

  // 用服务器时间与开奖时间的差值计算，避免手机时区不同造成偏差。
  nextDrawAt=Date.now()+difference;
  nextZeroCheckAt=0;
  document.getElementById("drawTimeText").textContent=
    "下一期开奖时间："+drawTime;
}

function extractHistory(json){
  const found=[];
  const visited=new Set();

  const issueKeys=[
    "preDrawIssue","issue","drawIssue","expect",
    "period","qihao","issueNo","drawNo"
  ];
  const codeKeys=[
    "preDrawCode","drawCode","code","numbers",
    "openCode","resultCode","lotteryCode"
  ];

  function walk(obj,depth){
    if(!obj||typeof obj!=="object"||depth>12||visited.has(obj))return;
    visited.add(obj);

    if(Array.isArray(obj)){
      for(const item of obj)walk(item,depth+1);
      return;
    }

    let issue=null,code=null;

    for(const k of issueKeys){
      if(obj[k]!==undefined&&obj[k]!==null){
        issue=String(obj[k]);
        break;
      }
    }

    for(const k of codeKeys){
      if(obj[k]!==undefined&&obj[k]!==null){
        code=normalizeCode(obj[k]);
        if(code)break;
      }
    }

    if(issue&&code){
      found.push({issue,code});
    }

    for(const value of Object.values(obj)){
      if(value&&typeof value==="object")walk(value,depth+1);
    }
  }

  walk(json,0);

  const unique=new Map();
  found.forEach(d=>{
    if(d.issue&&d.code)unique.set(d.issue,d);
  });

  return Array.from(unique.values());
}

function mergeDraws(list){
  const map=new Map();
  draws.forEach(d=>{
    if(d.issue&&d.code)map.set(String(d.issue),d);
  });
  list.forEach(d=>{
    if(d.issue&&d.code)map.set(String(d.issue),d);
  });

  draws=Array.from(map.values())
    .sort((a,b)=>issueValue(a.issue)-issueValue(b.issue))
    .slice(-500);
}

function chooseNumbers(position){
  const data=draws.slice(-100);
  if(!data.length)return [0,1,2,3,4,5,6];

  const freq=Array(10).fill(0);
  const r10=Array(10).fill(0);
  const r20=Array(10).fill(0);
  const r30=Array(10).fill(0);

  data.forEach(d=>{
    const n=d.code[position];
    if(Number.isInteger(n))freq[n]++;
  });

  data.slice(-10).forEach(d=>r10[d.code[position]]++);
  data.slice(-20).forEach(d=>r20[d.code[position]]++);
  data.slice(-30).forEach(d=>r30[d.code[position]]++);

  const lastIndex=Array(10).fill(-1);
  data.forEach((d,i)=>lastIndex[d.code[position]]=i);

  const scores=[];

  for(let n=0;n<10;n++){
    const omission=lastIndex[n]===-1?data.length:data.length-1-lastIndex[n];

    const frequencyScore=freq[n]/Math.max(1,data.length);
    const score10=r10[n]/10;
    const score20=r20[n]/Math.min(20,data.length);
    const score30=r30[n]/Math.min(30,data.length);
    const omissionScore=Math.min(omission,30)/30;

    // 长期频率、近10/20/30期热度、遗漏综合评分。
    const score=
      frequencyScore*25+
      score10*30+
      score20*20+
      score30*15+
      omissionScore*10;

    scores.push({number:n,score});
  }

  scores.sort((a,b)=>b.score-a.score||a.number-b.number);
  return scores.slice(0,7).map(x=>x.number);
}

function createPredictions(){
  if(!nextIssue)return;

  const exists=records.some(r=>String(r.issue)===String(nextIssue));
  if(exists)return;

  const prediction={
    issue:String(nextIssue),
    createdAt:new Date().toISOString(),
    systems:{}
  };

  SYSTEMS.forEach(sys=>{
    prediction.systems[sys.id]={
      numbers:sys.positions.map(pos=>chooseNumbers(pos)),
      status:"待开奖",
      actual:null
    };
  });

  records.unshift(prediction);
  records=records.slice(0,300);
  saveLocal();
}

function settleRecords(){
  let changed=false;

  records.forEach(record=>{
    const result=draws.find(d=>String(d.issue)===String(record.issue));
    if(!result)return;

    SYSTEMS.forEach(sys=>{
      const item=record.systems?.[sys.id];
      if(!item||item.status!=="待开奖")return;

      const hit=sys.positions.every((pos,i)=>
        item.numbers[i].includes(result.code[pos])
      );

      item.status=hit?"中":"挂";
      item.actual=sys.positions.map(pos=>result.code[pos]);
      item.allActual=result.code;
      changed=true;
    });
  });

  if(changed)saveLocal();
}

function updateStats(){
  SYSTEMS.forEach(sys=>{
    let win=0,lose=0;
    records.forEach(r=>{
      const s=r.systems?.[sys.id]?.status;
      if(s==="中")win++;
      if(s==="挂")lose++;
    });
    const total=win+lose;
    document.getElementById(sys.id+"Win").textContent=win;
    document.getElementById(sys.id+"Lose").textContent=lose;
    document.getElementById(sys.id+"Rate").textContent=
      total?(win/total*100).toFixed(1)+"%":"0%";
  });
}

function renderPrediction(sys){
  const target=records.find(r=>r.systems?.[sys.id]);
  const box=document.getElementById(sys.id+"Prediction");

  if(!target){
    box.innerHTML='<div class="muted">等待历史数据后生成预测</div>';
    return;
  }

  const item=target.systems[sys.id];
  let html="";

  sys.positions.forEach((pos,i)=>{
    const label=["万位","千位","百位","十位","个位"][pos];
    html+='<div class="row"><strong>'+label+'</strong><span class="muted">推荐7个号码</span></div>';
    html+='<div class="numbers">';
    item.numbers[i].forEach(n=>{
      const hit=item.actual&&item.actual[i]===n;
      html+='<span class="num '+(hit?"hit":"selected")+'">'+n+'</span>';
    });
    html+='</div>';
  });

  const statusClass=item.status==="中"?"win":
    item.status==="挂"?"lose":"pending";

  html+='<div class="row small"><span>预测状态：<strong class="status '+statusClass+'">'+item.status+'</strong></span>';
  if(item.actual)html+='<span>实际号码：'+item.actual.join(" / ")+'</span>';
  html+='</div>';

  box.innerHTML=html;
  document.getElementById("issue"+(sys.id==="first"?"First":sys.id==="middle"?"Middle":"Last")).textContent=target.issue;
}

function renderRecords(){
  const box=document.getElementById("records");
  document.getElementById("recordCount").textContent=records.length+"条记录";

  if(!records.length){
    box.innerHTML='<div class="muted">暂时没有预测记录</div>';
    return;
  }

  box.innerHTML=records.slice(0,50).map(r=>{
    let html='<div class="record"><strong>第 '+r.issue+' 期</strong>';
    SYSTEMS.forEach(sys=>{
      const item=r.systems?.[sys.id];
      if(!item)return;
      const cls=item.status==="中"?"win":item.status==="挂"?"lose":"pending";
      html+='<div style="margin-top:6px">'+sys.name+'：';
      html+=item.numbers.map(a=>a.join("")).join(" / ");
      html+='　<span class="'+cls+'">'+item.status+'</span></div>';
    });
    html+='</div>';
    return html;
  }).join("");
}

function renderHistory(){
  const box=document.getElementById("historyList");
  document.getElementById("historyInfo").textContent=
    "已保存 "+draws.length+" 期历史开奖数据";

  box.innerHTML=draws.slice(-10).reverse().map(d=>
    '<div class="record"><div class="row"><span>第 '+d.issue+' 期</span><span>'+
    d.code.join(" - ")+'</span></div></div>'
  ).join("");
}

function render(){
  SYSTEMS.forEach(renderPrediction);
  renderRecords();
  renderHistory();
  updateStats();

  document.getElementById("latestIssue").textContent=
    "最新已开奖期号："+(currentIssue||"--");

  if(latestCode.length===5){
    document.getElementById("latestNumbers").innerHTML=
      latestCode.map(n=>'<span class="ball">'+n+'</span>').join("");
  }
}

async function loadData(){
  if(loading)return;
  loading=true;
  document.getElementById("dataStatus").textContent="正在更新...";

  try{
    const results=await Promise.all([
      fetch(API_CURRENT,{cache:"no-store"}),
      fetch(API_HISTORY,{cache:"no-store"})
    ]);

    if(!results[0].ok)throw new Error("当前开奖接口 HTTP "+results[0].status);
    if(!results[1].ok)throw new Error("历史开奖接口 HTTP "+results[1].status);

    const currentJSON=await results[0].json();
    const historyJSON=await results[1].json();

    const current=parseCurrent(currentJSON);
    const history=extractHistory(historyJSON);

    currentIssue=current.issue;
    nextIssue=current.nextIssue||getNextIssue(current.issue);
    latestCode=current.code;

    updateDrawCountdown(current.serverTime,current.drawTime);

    mergeDraws(history);
    mergeDraws([{issue:current.issue,code:current.code}]);

    settleRecords();
    createPredictions();
    saveLocal();
    render();

    document.getElementById("dataStatus").textContent="数据更新成功";
    if(!history.length){
      setMessage("当前开奖读取成功，但历史接口暂时没有识别到开奖记录。");
    }else{
      setMessage("当前开奖和历史数据读取成功。");
    }
    lastError="";
  }catch(e){
    lastError=e.message||String(e);
    document.getElementById("dataStatus").textContent="读取失败";
    setMessage("自动读取失败："+lastError);
    render();
  }finally{
    loading=false;
    nextCheckAt=Date.now()+REFRESH_SECONDS*1000;
  }
}

function manualRefresh(){
  nextCheckAt=Date.now()+REFRESH_SECONDS*1000;
  loadData();
}

function formatCountdown(ms){
  if(ms<=0)return "00:00:00";
  const total=Math.floor(ms/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function countdownTick(){
  const el=document.getElementById("countdown");

  if(!nextDrawAt){
    el.textContent="等待开奖时间";
  }else{
    const remaining=nextDrawAt-Date.now();
    if(remaining>0){
      el.textContent=formatCountdown(remaining);
    }else{
      el.textContent="开奖时间已到";
      if(!nextZeroCheckAt||Date.now()>=nextZeroCheckAt){
        nextZeroCheckAt=Date.now()+2000;
        loadData();
      }
    }
  }

  if(Date.now()>=nextCheckAt){
    nextCheckAt=Date.now()+REFRESH_SECONDS*1000;
    loadData();
  }
}

function setMessage(text){
  document.getElementById("message").textContent=text;
}

function importData(){
  const text=document.getElementById("importText").value.trim();
  if(!text){
    setMessage("请先粘贴开奖数据。");
    return;
  }

  try{
    let json;
    try{
      json=JSON.parse(text);
    }catch(e){
      const lines=text.split(/\n+/);
      const list=[];
      lines.forEach(line=>{
        const m=line.match(/(\d{5,})[^\d]+([\d,\s-]{9,})/);
        if(m){
          const code=normalizeCode(m[2]);
          if(code)list.push({issue:m[1],code});
        }
      });
      if(!list.length)throw new Error("没有识别到有效开奖数据");
      mergeDraws(list);
      settleRecords();
      saveLocal();
      render();
      setMessage("导入成功："+list.length+"期数据。");
      return;
    }

    const list=extractHistory(json);
    if(!list.length)throw new Error("没有识别到有效开奖数据");

    mergeDraws(list);
    settleRecords();
    saveLocal();
    render();
    setMessage("导入成功："+list.length+"期数据。");
  }catch(e){
    setMessage("导入失败："+e.message);
  }
}

function exportData(){
  const data=JSON.stringify({draws,records},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="极速时时彩预测备份.json";
  a.click();
  URL.revokeObjectURL(url);
  setMessage("备份文件已生成。");
}

function clearRecords(){
  if(!confirm("确定清空所有预测记录吗？历史开奖数据会保留。"))return;
  records=[];
  saveLocal();
  render();
  setMessage("预测记录已清空。");
}

loadLocal();
render();
loadData();
setInterval(countdownTick,1000);
</script>
</body>
</html>
